[package]
name = "scrivo"
version = "0.1.0"
description = "A fast, open-source, Typora-style markdown editor"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
members = ["render"]

[lib]
name = "scrivo_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
scrivo-render = { path = "render" }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
