[package]
name = "scrivo"
version = "0.1.0"
description = "A fast, open-source, Typora-style markdown editor"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
members = ["render"]

[lib]
name = "scrivo_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "8.2.0"
scrivo-render = { path = "render" }
tauri-plugin-opener = "2"
tempfile = "3"

# prewarm.rs: the same GLib stack Tauri already links on Linux (versions match tauri's).
[target.'cfg(target_os = "linux")'.dependencies]
gdk-pixbuf = "0.18"
gio = "0.18"
libc = "0.2"
sha2 = "0.10.9"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
sha2 = "0.10.9"

[dev-dependencies]
proptest = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
